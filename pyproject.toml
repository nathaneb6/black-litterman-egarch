[project]
name = "bl-portfolio"
version = "1.0.0"
description = "Black-Litterman portfolio optimisation with Ledoit-Wolf shrinkage and EGARCH-M views"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "arch", "statsmodels"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
